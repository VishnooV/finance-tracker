<style>
:root{
 --bg:#F4F1FB;--ink:#1B1730;--mt:#5F5876;--card:#FFFFFF;--line:rgba(27,23,48,.08);
 --lav:#E6DEFF;--lavx:#34268A;--but:#FFEDB8;--butx:#6B4E00;
 --mint:#3FBF85;--mintbg:#D6F5E5;--mintx:#16613F;
 --pch:#FF9A6B;--pchbg:#FFE3D6;--pchx:#8F3A17;
 --sky:#7CB8F2;--rose:#F28DB2;--lime:#B5D96A;
 --pri:#4733C8;--onp:#FFFFFF;--isl:#1B1730;--isx:#FFFFFF;--isf:rgba(255,255,255,.14);
 --amb:#FFB020;--ambx:#3A2600;--red:#FF8585;--redbg:#FFE0E0;--redx:#7E1A1A;
 --kb:0px;--spring:cubic-bezier(.34,1.45,.64,1);--soft:cubic-bezier(.34,1.2,.64,1);
 --font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#110F1A;--ink:#F1EEFA;--mt:#B3ACC9;--card:#1D1A2B;--line:rgba(241,238,250,.08);
 --lav:#2B2352;--lavx:#D9D0FF;--but:#3E3210;--butx:#FFD978;
 --mint:#3BB57C;--mintbg:#163A2A;--mintx:#9CE9C3;
 --pch:#EC8456;--pchbg:#45261A;--pchx:#FFC2A6;
 --sky:#5A9AD8;--rose:#D46F95;--lime:#8FB548;
 --pri:#BFB2FF;--onp:#1A1440;--isl:#F1EEFA;--isx:#16132A;--isf:rgba(22,19,42,.08);
 --red:#E26464;--redbg:#4A1E1E;--redx:#FFC9C9;
 color-scheme:dark;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font)}
body{min-height:100dvh;font-size:15px;line-height:1.4;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(120px + env(safe-area-inset-bottom))}

.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.top .per{font-size:13px;color:var(--mt)}
.top .sp{flex:1}
.ib{width:46px;height:46px;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;position:relative;transition:transform .3s var(--spring)}
.ib:active{transform:scale(.9)}
.ib svg{width:22px;height:22px}
.dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--amb);display:none}
.dot.on{display:block}

.hero{background:var(--lav);color:var(--lavx);border-radius:32px 32px 32px 12px;padding:18px 18px 16px}
.hrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hlab{font-size:13px;font-weight:500;margin-right:auto}
.pill{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.p-but{background:var(--but);color:var(--butx)}
.p-card{background:var(--card);color:var(--lavx)}
button.pill{min-height:32px}
.odo{display:flex;align-items:flex-end;font-size:44px;font-weight:700;letter-spacing:-.035em;height:1.15em;line-height:1.15em;overflow:hidden;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.odo .dg{display:inline-block;height:1.15em;overflow:hidden}
.odo .dc{display:flex;flex-direction:column;transition:transform 1s var(--spring)}
.odo .dc span{height:1.15em}
.odo .sym{display:inline-block}
.odo .cur{font-size:.6em;margin-right:.08em;align-self:center;opacity:.85}
.miss{font-size:12px;margin-bottom:4px}
.bar{display:flex;gap:3px;height:12px;margin:10px 0 8px}
.bar>i{display:block;border-radius:999px;min-width:10px}
.bar>i.off{opacity:.35;background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(255,255,255,.5) 4px 8px)}
.leg{display:flex;gap:6px;flex-wrap:wrap}
.leg .pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px}
.leg .sw{width:9px;height:9px;border-radius:50%;flex:none}
.acts{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;min-height:50px;border-radius:999px;font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;transition:transform .3s var(--spring)}
.btn:active{transform:scale(.95)}
.btn svg{width:20px;height:20px}
.b-pri{background:var(--pri);color:var(--onp)}
.b-card{background:var(--card);color:var(--lavx)}
.hold .fill{position:absolute;inset:0;background:var(--mint);opacity:.55;transform:scaleX(0);transform-origin:left center;transition:transform .2s ease-out;will-change:transform}
.hold.go .fill{transform:scaleX(1);transition:transform 1.1s linear}
.hold span{position:relative}

.secl{font-size:13px;color:var(--mt);margin:20px 4px 10px;display:flex;justify-content:space-between}
.tl{position:relative;padding-left:6px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--pri);opacity:.22}
.cw{position:relative;margin:0 0 8px 24px;border-radius:20px;touch-action:pan-y}
.cw .bk{position:absolute;inset:0;border-radius:20px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:500;font-size:14px;opacity:0;transition:opacity .15s}
.cw[data-d=r] .bk{opacity:1;background:var(--mintbg);color:var(--mintx)}
.cw[data-d=l] .bk{opacity:1;background:var(--redbg);color:var(--redx)}
.cw[data-d=r] .bk .l2,.cw[data-d=l] .bk .l1{visibility:hidden}
.cap{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px 14px;cursor:pointer;transition:transform .35s var(--soft)}
.cap.ret{background:var(--redbg)}
.nd{position:absolute;left:-24px;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:var(--pri);box-shadow:0 0 0 4px var(--bg)}
.ci{flex:1;min-width:0}
.cn{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{font-size:12px;color:var(--mt);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ca{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.ca small{display:block;font-size:11px;color:var(--mt);font-weight:400}
.tag{border-radius:6px;padding:1px 6px;font-size:11px;font-weight:500;background:var(--mintbg);color:var(--mintx)}
.tag.am{background:var(--but);color:var(--butx)}
.cret .cn,.cret .ca{color:var(--redx)}
.fly{animation:fly .75s var(--soft) both}
@keyframes fly{from{opacity:0;transform:translateY(60vh) scale(.6)}}
.empty{text-align:center;padding:48px 20px;color:var(--mt)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;font-weight:500}

.scrim{position:fixed;inset:0;background:rgba(17,15,26,.42);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.isl{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));width:232px;height:58px;border-radius:29px;background:var(--isl);color:var(--isx);z-index:30;display:flex;align-items:center;gap:12px;padding:0 18px;cursor:pointer;transform:translateX(-50%);transition:transform .35s var(--spring),opacity .2s;will-change:transform}
.isl:active{transform:translateX(-50%) scale(.95)}
.isl.hide{opacity:0;transform:translateX(-50%) scale(.85);pointer-events:none}
.isl svg{width:22px;height:22px;flex:none}
.isl b{display:block;font-size:14px;font-weight:500}
.isl small{font-size:12px;opacity:.7}
.ip{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom) + var(--kb));width:min(calc(100vw - 24px),496px);max-height:calc(100dvh - var(--kb) - 40px);overflow-y:auto;overscroll-behavior:contain;border-radius:28px;background:var(--isl);color:var(--isx);z-index:31;opacity:0;pointer-events:none;transform:translateX(-50%) translateY(24px) scale(.9);transform-origin:50% 100%;transition:transform .38s cubic-bezier(.2,.9,.3,1.1),opacity .2s;will-change:transform,opacity}
.ip.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.ip .body{padding:16px 18px 18px}
.ih{display:flex;align-items:center;margin-bottom:10px}
.ih b{font-weight:500;font-size:16px;flex:1}
.ix{width:40px;height:40px;border-radius:14px;background:var(--isf);display:flex;align-items:center;justify-content:center}
.ix svg{width:18px;height:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--isf);padding:0 12px;min-height:38px;font-size:14px;font-weight:500;animation:pin .45s var(--spring) both}
.chip input,.chip select{background:none;border:0;outline:none;font-size:16px;font-weight:500;width:auto}
.chip input[type=date]{width:150px;color-scheme:inherit}
.chip .amt{width:110px}
.chip:focus-within{box-shadow:0 0 0 2px var(--mint)}
.chip.am{position:relative;background:var(--amb);color:var(--ambx)}
.chip.am:after{content:"";position:absolute;inset:-4px;border-radius:999px;border:3px solid var(--amb);opacity:0;pointer-events:none;animation:ring 1.8s 1s infinite;will-change:transform,opacity}
.chip.lab{font-weight:400;opacity:.85}
@keyframes pin{from{opacity:0;transform:scale(.7) translateY(6px)}}
@keyframes ring{0%{opacity:.7;transform:scale(.94)}100%{opacity:0;transform:scale(1.12)}}
.big{width:100%;background:var(--isf);border:0;border-radius:16px;padding:12px 14px;font-size:20px;font-weight:500;outline:none;margin-bottom:8px}
.big:focus{box-shadow:0 0 0 2px var(--mint)}
.big::placeholder,.ip textarea::placeholder,.chip input::placeholder{color:currentColor;opacity:.45}
.ip textarea{width:100%;background:transparent;border:1.5px dashed currentColor;border-radius:16px;padding:10px 12px;font-size:16px;resize:none;outline:none;opacity:.8;margin-bottom:8px;min-height:52px}
.warn{border-radius:14px;padding:9px 12px;font-size:13px;font-weight:500;margin-bottom:8px;background:var(--red);color:#2A0606}
.note{border-radius:14px;padding:9px 12px;font-size:13px;margin-bottom:8px;background:var(--isf)}
.ia{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.ia .hint{font-size:12px;opacity:.7;flex:1 1 100%}
.ia .hint:empty{display:none}
.ib2{min-height:44px;border-radius:15px;padding:0 16px;font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:6px;transition:transform .25s var(--spring)}
.ib2:active{transform:scale(.94)}
.ib2 svg{width:18px;height:18px}
.go{background:var(--isx);color:var(--isl)}
.gh{background:var(--isf)}
.dg2{background:var(--red);color:#2A0606}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.brow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.brow input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--mint)}
.brow .chip{flex:none;font-size:13px;min-height:36px;animation:none}
.brow .big{font-size:16px;padding:9px 12px;margin:0}
.brow.dup{opacity:.55}

.panel{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:88dvh;overflow-y:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom));z-index:40;transform:translateY(105%);transition:transform .45s var(--soft);will-change:transform}
.panel.on{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--mt);opacity:.35;margin:0 auto 14px}
.panel h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:12px}
.fl{font-size:13px;color:var(--mt);margin:12px 2px 6px}
.in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
.in:focus{border-color:var(--pri)}
.prow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pb{flex:1;min-height:48px;border-radius:16px;background:var(--card);font-weight:500;padding:0 14px}
.pb.pri{background:var(--pri);color:var(--onp)}
.hi{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:8px}
.hi b{font-size:16px;font-weight:500}
.hi .m{font-size:12px;color:var(--mt);margin-top:3px}
.ver{font-size:12px;color:var(--mt);margin-top:20px;text-align:center}

.toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translate(-50%,-140%);background:var(--isl);color:var(--isx);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;z-index:60;width:min(92vw,420px);font-size:14px;transition:transform .45s var(--soft);will-change:transform}
.toast.on{transform:translate(-50%,0)}
.toast span{flex:1}
.toast button{background:var(--isx);color:var(--isl);border-radius:12px;padding:8px 12px;font-weight:500;font-size:13px}
.banner{background:var(--redbg);color:var(--redx);border-radius:18px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.banner button{display:block;margin-top:8px;font-weight:500;text-decoration:underline}
.hid{display:none!important}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<script>
"use strict";
/* Ledger (personal bill tracker for Dad)
   Version constant below is the single source of truth.
   Changelog
   3.1.0  15 Nov 2026  Renamed to Ledger. Theme follows the phone setting. Restore no longer brings back the backup counter or theme. Open copies stay in step. Animations moved to transform and opacity only; list updates in place.
   3.0.0  15 Nov 2026  Rebuild. Cards, platforms and notes removed. Bank rules for Axis, SBI and BOB SMS. Foreign currency with daily auto rates and statement rate override. Command island entry with Enter flow, duplicate warning, refund matching, bulk paste and payment SMS. Hold to settle, auto backup on settle, settled bills with undo. All defects from the v2 review fixed. */
const VERSION='3.1.0';
const KEY='dadsBill3',OLD_KEY='dadBillData';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=x=>Math.round((Number(x)+Number.EPSILON)*100)/100;
const num=x=>{const n=typeof x==='number'?x:parseFloat(String(x==null?'':x).replace(/,/g,''));return isFinite(n)?n:NaN};
function fmt(n){n=r2(n);const neg=n<0;n=Math.abs(n);const frac=Math.round(n*100)%100!==0;return (neg?'-':'')+n.toLocaleString('en-IN',{minimumFractionDigits:frac?2:0,maximumFractionDigits:2})}
function money(n,cur){cur=cur||'INR';if(cur==='INR')return (n<0?'-₹':'₹')+fmt(Math.abs(n));return cur+' '+fmt(n)}
function iso(d){d=d||new Date();const y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate();return y+'-'+String(m).padStart(2,'0')+'-'+String(dd).padStart(2,'0')}
const today=()=>iso(new Date());
function validIso(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return false;const [y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1,d);return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d}
function dShort(s){if(!validIso(s))return 'not set';const [,m,d]=s.split('-').map(Number);return d+' '+MON[m-1]}
function dLong(s){if(!validIso(s))return 'not set';const [y,m,d]=s.split('-').map(Number);return d+' '+MON[m-1]+' '+y}
let lastId=0;const uid=()=>{let t=Date.now();if(t<=lastId)t=lastId+1;lastId=t;return t};
const mkey=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');

/* ---------- state ---------- */
function blank(){return{v:3,entries:[],history:[],carry:0,lastSettled:null,lastBilled:null,manual:{},fx:{},mem:{},
 settings:{wa:'',nudgeDays:7},
 changes:0,lastBackup:null,lastClip:''}}
function cleanEntry(e){
 if(!e||typeof e!=='object')return null;
 const amount=num(e.amount);if(!isFinite(amount)||amount===0)return null;
 const id=Number(e.id)||uid();
 let date=String(e.date||'');if(!validIso(date))date=iso(new Date(id));
 const cur=/^[A-Z]{3}$/.test(e.cur||'')?e.cur:'INR';
 const o={id,name:String(e.name||'Item').slice(0,60),amount:r2(amount),cur,date,merchant:String(e.merchant||'').slice(0,40)};
 if(e.rid!=null&&isFinite(Number(e.rid)))o.rid=Number(e.rid);
 if(e.dateCheck)o.dateCheck=true;
 if(e.note)o.note=String(e.note).slice(0,80);
 if(e.inr!=null&&isFinite(num(e.inr)))o.inr=r2(num(e.inr));
 return o}
function norm(p){
 const s=blank();if(!p||typeof p!=='object')return s;
 s.entries=(Array.isArray(p.entries)?p.entries:[]).map(cleanEntry).filter(Boolean);
 s.history=(Array.isArray(p.history)?p.history:[]).filter(h=>h&&typeof h==='object').map(h=>{
  const from=h.from?iso(new Date(h.from)):null,to=h.to?iso(new Date(h.to)):null;
  return{id:Number(h.id)||uid(),from:validIso(h.from)?h.from:from,to:validIso(h.to)?h.to:to,
   entries:(Array.isArray(h.entries)?h.entries:[]).map(cleanEntry).filter(Boolean),
   carryIn:r2(num(h.carryIn)||0),total:r2(num(h.total)||0),paid:r2(num(h.paid)||0),
   manual:(h.manual&&typeof h.manual==='object')?h.manual:{},prevSettled:h.prevSettled||null,prevBilled:h.prevBilled||null}});
 s.carry=r2(num(p.carry)||0);
 const ls=p.lastSettled||p.lastSettledDate||null;
 s.lastSettled=ls?(validIso(ls)?ls:iso(new Date(ls))):null;if(s.lastSettled&&!validIso(s.lastSettled))s.lastSettled=null;
 s.lastBilled=p.lastBilled||null;
 for(const k of ['manual','fx','mem'])if(p[k]&&typeof p[k]==='object')for(const [a,b] of Object.entries(p[k])){
  if(k==='mem')s.mem[String(a)]=String(b).slice(0,60);else{const n=num(b);if(n>0)s[k][String(a)]=n}}
 if(p.settings&&typeof p.settings==='object'){s.settings.wa=String(p.settings.wa||'');const nd=parseInt(p.settings.nudgeDays,10);if(nd>0)s.settings.nudgeDays=nd}
 s.changes=parseInt(p.changes,10)||0;s.lastBackup=p.lastBackup||null;s.lastClip=String(p.lastClip||'');
 return s}
let corruptRaw=null;
function load(){
 let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
 if(raw){try{return norm(JSON.parse(raw))}catch(e){corruptRaw=raw;try{localStorage.setItem(KEY+'_corrupt',raw)}catch(_){}return blank()}}
 let old=null;try{old=localStorage.getItem(OLD_KEY)}catch(e){}
 if(old){try{const s=norm(JSON.parse(old));s.changes=0;setTimeout(()=>toast('Brought over your entries from the old version'),600);return s}catch(e){}}
 return blank()}
let S=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('Could not save on this phone. Back up now');return false}}
function save(count){if(count!==false)S.changes++;persist();render()}
window.addEventListener('storage',ev=>{if(ev.key!==KEY||!ev.newValue)return;try{S=norm(JSON.parse(ev.newValue))}catch(_){return}if(IS){closeIsland();toast('Updated from another open copy')}render()});

/* ---------- money maths ---------- */
function rateFor(e){if(e.cur==='INR')return 1;if(S.manual[e.cur]>0)return S.manual[e.cur];const f=S.fx[e.cur+'|'+e.date];return f>0?f:null}
function inrOf(e){if(e.cur==='INR')return e.amount;const r=rateFor(e);return r==null?null:r2(e.amount*r)}
const returnedOf=e=>r2(S.entries.filter(x=>x.rid===e.id).reduce((a,x)=>a-x.amount,0));
function calc(){
 let inr=0;const fx={};
 for(const e of S.entries){if(e.cur==='INR'){inr+=e.amount;continue}
  const g=fx[e.cur]||(fx[e.cur]={sum:0,inr:0,missing:false});g.sum+=e.amount;const v=inrOf(e);if(v==null)g.missing=true;else g.inr+=v}
 let total=S.carry+inr;const missing=[];
 for(const c of Object.keys(fx)){fx[c].sum=r2(fx[c].sum);fx[c].inr=r2(fx[c].inr);if(fx[c].missing)missing.push(c);else total+=fx[c].inr}
 return{inr:r2(inr),fx,total:r2(total),missing}}
function billStart(){const d=S.entries.map(e=>e.date).filter(validIso).sort();let s=d[0]||null;if(S.lastSettled&&(!s||S.lastSettled<s))s=S.lastSettled;return s||today()}

/* ---------- SMS parser ---------- */
const CURS=new Set(['INR','USD','EUR','GBP','AED','SGD','MUR','THB','JPY','AUD','CAD','CHF','CNY','HKD','MYR','LKR','NPR','QAR','SAR','OMR','KWD','BHD','NZD','ZAR','IDR','VND','KRW','TRY','EGP','PHP','SEK','NOK','DKK','PLN','CZK','HUF','ILS','MXN','BRL','BDT','MVR','KES','TWD']);
const NUM='([\\d,]+(?:\\.\\d{1,2})?)';
function curOf(t){t=String(t||'').replace(/\./g,'').toUpperCase();if(t==='RS'||t==='₹'||t==='INR')return 'INR';return CURS.has(t)?t:null}
const IGNORE=/\b(otp|one[- ]time password|statement|min(?:imum)? (?:amt|amount) due|total (?:amt|amount)|due (?:on|date)|received towards|thank you for (?:your |the )?payment|e-?mail id|has been blocked|limit (?:has been )?(?:increased|enhanced))\b/i;
function mkDate(y,m,d){y=+y;m=+m;d=+d;if(y<100)y+=2000;const s=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');return validIso(s)?s:null}
const ALIAS=[['amazon','Amazon'],['flipkart','Flipkart'],['myntra','Myntra'],['swiggy','Swiggy'],['zomato','Zomato'],['uber','Uber'],['zepto','Zepto'],['blinkit','Blinkit'],['bigbasket','BigBasket'],['nykaa','Nykaa'],['ajio','Ajio'],['zudio','Zudio'],['meesho','Meesho']];
function cleanMer(s){
 s=String(s).replace(/^\d{1,2}:\d{2}(?::\d{2})?\s*(?:at\s+)?/i,'').replace(/^UPI[-\s]*/i,'').replace(/\b\w*\d{5,}\w*\b/g,' ').replace(/[*_]+/g,' ').replace(/\s+/g,' ').trim();
 const low=s.toLowerCase().replace(/[^a-z]/g,'');for(const [k,v] of ALIAS)if(low.startsWith(k))return v;
 s=s.replace(/\b(pvt|private|ltd|limited|india)\b\.?/gi,' ').replace(/\s+/g,' ').replace(/[-\s]+$/,'').trim();
 return s.toLowerCase().replace(/(^|[\s\-(])([a-z])/g,(a,b,c)=>b+c.toUpperCase()).slice(0,40)}
function parseOne(raw){
 const lines=String(raw).replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);
 const t=lines.join(' ').replace(/\s+/g,' ').trim();if(!t)return null;
 const o={};let m;
 if((m=t.match(new RegExp('\\bSpent\\s+([A-Z]{3}|Rs\\.?|₹)\\s*'+NUM,'i')))||(m=t.match(new RegExp('\\btxn of\\s+([A-Z]{3}|Rs\\.?|₹)\\s*'+NUM,'i')))||(m=t.match(new RegExp('(Rs\\.?|INR|₹)\\s*'+NUM+'\\s+(?:spent|debited)','i')))){o.cur=curOf(m[1]);o.amount=num(m[2])}
 if(!(o.amount>0)||!o.cur){const head=t.split(/\b(?:avl|avbl|available|limit|bal|balance)\b/i)[0];const re=new RegExp('(Rs\\.?|RS\\.?|rs\\.?|₹|\\b[A-Z]{3})\\s?'+NUM,'g');let x;o.amount=undefined;
  while((x=re.exec(head))){const c=curOf(x[1]);const v=num(x[2]);if(c&&v>0){o.cur=c;o.amount=v;break}}}
 if(IGNORE.test(t)&&!/\b(spent|txn of)\b/i.test(t))o.kind='ignore';
 else if(/\b(refund|refunded|reversal|reversed)\b/i.test(t)||/credited to your (?:\w+ )?(?:credit )?card/i.test(t))o.kind='refund';
 else if(/\b(credited|received)\b/i.test(t)&&!/\b(spent|debited|txn of|purchase)\b/i.test(t))o.kind='credit';
 else if(/\b(spent|debited|txn of|purchase|charged|paid|was successful)\b/i.test(t))o.kind='purchase';
 else o.kind=o.amount>0?'purchase':'unknown';
 let mer=null;
 const dl=lines.findIndex(l=>/^\d{2}-\d{2}-\d{2,4}\s+\d{1,2}:\d{2}(?::\d{2})?(?:\s*IST)?$/i.test(l));
 if(dl>=0&&lines[dl+1]&&!/^(avl|avbl|available|not you)/i.test(lines[dl+1]))mer=lines[dl+1];
 else if((m=t.match(/\d{2}-\d{2}-\d{2,4}\s+\d{1,2}:\d{2}(?::\d{2})?\s*IST\s+(.+?)\s+(?:Avl|Avbl|Available)\b/i)))mer=m[1];
 else if((m=t.match(/\bAT\s+(.+?)\s+WAS\s+SUCCESSFUL/i)))mer=m[1];
 else if((m=t.match(/\bat\s+(.+?)\s+on\s+(?:\d|[A-Za-z]{3}\b)/i)))mer=m[1];
 else{for(const w of ['from','at','to']){const r=new RegExp('\\b'+w+'\\s+(.+?)(?=\\s+(?:on|via|by|ref|avl|was|using|towards|for|from)\\b|[.,;]|$)','gi');let x;while((x=r.exec(t))){if(!/^(your|card|a\/c|ac\b|account|xx|\d)/i.test(x[1])){mer=x[1];break}}if(mer)break}}
 if(mer){}
 else if((m=t.match(/(?:merchant|info|vpa)\s*[:\-]\s*(.+?)(?=[.,;]|\s+(?:on|avl|ref)\b|$)/i)))mer=m[1];
 if(mer){mer=cleanMer(mer);if(mer.length>1&&!/^\d+$/.test(mer))o.merchant=mer}
 if((m=t.match(/\b(20\d{2})-(\d{2})-(\d{2})\b/)))o.date=mkDate(m[1],m[2],m[3]);
 else if((m=t.match(/\b(\d{1,2})[-\/ ]([A-Za-z]{3})[a-z]*[-\/ ,]*(\d{2,4})\b/))){const i=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(i>=0)o.date=mkDate(m[3],i+1,m[1])}
 else if((m=t.match(/\b(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})\b/)))o.date=mkDate(m[3],m[2],m[1]);
 if(o.date&&o.date>today())o.date=null;
 if(!o.date){o.date=today();o.dateMissing=true}
 if(o.amount>0)o.amount=r2(o.amount);
 o.raw=t;return o}
function splitMsgs(text){
 const out=[];for(const p of String(text||'').replace(/\r/g,'').split(/\n\s*\n+/)){
  for(const seg of p.split(/(?=\bSpent\s+(?:[A-Z]{3}|Rs\.?)\s*\d)|(?=\bYour txn of\b)|(?=(?:Rs\.?|INR)\s*[\d,]+(?:\.\d+)?\s+spent\b)/i)){if(seg.trim())out.push(seg)}}
 return out.map(parseOne).filter(o=>o&&o.amount>0&&(o.kind==='purchase'||o.kind==='refund'||o.kind==='credit'))}

/* ---------- matching ---------- */
function findDup(c){
 const pool=S.entries.concat(S.history[0]?S.history[0].entries:[]);
 return pool.find(e=>e.cur===c.cur&&Math.abs(e.amount)===Math.abs(c.amount)&&Math.sign(e.amount)===Math.sign(c.amount)&&e.date===c.date&&(!c.merchant||!e.merchant||mkey(c.merchant)===mkey(e.merchant)))||null}
function findParent(c){
 const cands=S.entries.filter(e=>e.amount>0&&e.cur===c.cur&&r2(e.amount-returnedOf(e))>=c.amount);
 const byMer=c.merchant?cands.filter(e=>mkey(e.merchant)===mkey(c.merchant)):[];
 const exact=cands.filter(e=>r2(e.amount-returnedOf(e))===c.amount);
 const pick=(byMer.find(e=>e.amount===c.amount)||byMer[0]||exact[0]||null);return pick}

/* ---------- toast ---------- */
let tT,tFn;
function toast(msg,undo,label){clearTimeout(tT);tFn=undo||null;$('#tmsg').textContent=msg;const b=$('#tbtn');b.textContent=label||'Undo';b.classList.toggle('hid',!undo);$('#toast').classList.add('on');tT=setTimeout(()=>{$('#toast').classList.remove('on');tFn=null},undo?5000:3200)}
$('#tbtn').onclick=()=>{const f=tFn;tFn=null;$('#toast').classList.remove('on');if(f)f()};

/* ---------- icons ---------- */
const IC={
 sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',

 Object.keys(T.fx).forEach((c,i)=>{const g=T.fx[c],col=FXC[i%FXC.length];

 $('#bar').innerHTML=seg.join('');$('#leg').innerHTML=leg.join('');
 $('#bar').classList.toggle('hid',!S.entries.length);
 // list

 if(!E.length){L.innerHTML='<div class="empty"><b>Nothing on this bill yet</b>Copy a card SMS, then tap the bar at the bottom.</div>';flyIds.clear();return}

  const html='<div class="cw" data-id="'+e.id+'"><div class="bk"><span class="l1">Return</span><span class="l2">Delete</span></div><div class="cap'+(ret?' ret cret':'')+'"><span class="nd" style="width:'+size+'px;height:'+size+'px;background:'+col+'"></span><div class="ci"><div class="cn">'+title+'</div><div class="cs"><span>'+sub.join(' · ')+'</span>'+tags+'</div></div><div class="ca">'+main+small+'</div></div></div>';
  let n=have.get(String(e.id));
  if(!n||n.dataset.sig!==html){const t=document.createElement('div');t.innerHTML=html;n=t.firstElementChild;n.dataset.sig=html;bindSwipe(n);
   if(flyIds.has(e.id)){const c=n.querySelector('.cap');c.classList.add('fly');c.addEventListener('animationend',()=>c.classList.remove('fly'),{once:true})}}

function unbilledDays(){const ids=S.entries.filter(e=>!S.lastBilled||e.id>Date.parse(S.lastBilled)).map(e=>e.id);if(!ids.length)return null;return Math.floor((Date.now()-Math.min(...ids))/864e5)}

/* ---------- swipe on entries ---------- */
function bindSwipe(w){
 const cap=w.querySelector('.cap'),id=Number(w.dataset.id);let x0,y0,dx=0,lock=null,down=false,moved=false;
 cap.addEventListener('pointerdown',ev=>{if(ev.button>0)return;down=true;moved=false;lock=null;dx=0;x0=ev.clientX;y0=ev.clientY;cap.style.transition='none'});
 cap.addEventListener('pointermove',ev=>{if(!down)return;const mx=ev.clientX-x0,my=ev.clientY-y0;
  if(lock===null&&(Math.abs(mx)>8||Math.abs(my)>8)){lock=Math.abs(mx)>Math.abs(my);if(lock)try{cap.setPointerCapture(ev.pointerId)}catch(_){}}
  if(Math.abs(mx)>6||Math.abs(my)>6)moved=true;if(!lock)return;
  const e=S.entries.find(x=>x.id===id);dx=(mx>0&&e&&e.amount<0)?0:mx;w.dataset.d=dx>0?'r':dx<0?'l':'';cap.style.transform='translateX('+dx+'px)'});
 const end=ok=>{if(!down)return;down=false;cap.style.transition='';const e=S.entries.find(x=>x.id===id);
  if(ok&&lock&&dx>90&&e){cap.style.transform='translateX(110%)';setTimeout(()=>doReturn(e),160)}
  else if(ok&&lock&&dx<-90&&e){cap.style.transform='translateX(-110%)';setTimeout(()=>delEntry(e),160)}
  else{cap.style.transform='';w.dataset.d='';if(ok&&!moved&&e)openEdit(e)}};
 cap.addEventListener('pointerup',()=>end(true));cap.addEventListener('pointercancel',()=>end(false))}
function doReturn(e){
 const left=r2(e.amount-returnedOf(e));if(left<=0){toast('Already fully returned');render();return}
 const n={id:uid(),name:e.name,amount:-left,cur:e.cur,date:today(),merchant:e.merchant||'',rid:e.id};
 S.entries.push(n);flyIds.add(n.id);save();
 toast('Returned '+money(left,e.cur)+'. Tap it to change the amount',()=>{S.entries=S.entries.filter(x=>x.id!==n.id);save()})}
function delEntry(e){
 const gone=[e,...S.entries.filter(x=>x.rid===e.id)];S.entries=S.entries.filter(x=>!gone.includes(x));save();
 toast(gone.length>1?'Deleted with its return':'Deleted',()=>{S.entries.push(...gone);save()})}

 if(d){EF.dup=d;w.innerHTML='<div class="warn">Already on '+(S.entries.includes(d)?'this bill':'the last settled bill')+': '+esc(d.name)+' '+money(Math.abs(d.amount),d.cur)+' on '+dShort(d.date)+'</div><div class="ia" style="margin-bottom:8px"><span class="hint"></span><button class="ib2 gh" id="dSkip">Skip</button><button class="ib2 go" id="dAdd">Add anyway</button></div>';

 else EF.dup=null;

 const nameEl=$('#eName');let name=nameEl.value.trim();const a=num($('#eAmt').value),cur=$('#eCur').value,date=$('#eDate').value;

  if(!ret){const back=returnedOf(e);if(a<back){shake();$('#eHint').textContent='Returns on this item already total '+money(back,e.cur);return}}

let BK=[];
function openBulk(msgs,raw){
 S.lastClip=raw.slice(0,500);persist();

 const notes=BK.filter(b=>b.dup).map(b=>money(b.amount,b.cur)+' on '+dShort(b.date)+' matches '+esc(b.dup.name)).concat(BK.some(b=>b.dateMissing)?['A ? means the SMS had no date, so today is used']:[]).concat(BK.some(b=>b.kind==='credit')?['Payment SMS left unticked']:[]);

 ibody.querySelector('[data-close]').onclick=closeIsland;

 ins.forEach((el,i)=>el.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();if(ins[i+1])ins[i+1].focus();else saveBulk()}});
 $('#bSave').onclick=saveBulk;const first=ins.find((el,i)=>BK[i].on&&!el.value)||ins[0];if(first)first.focus({preventScroll:true})}
function saveBulk(){
 let added=0;const ids=[];
 ibody.querySelectorAll('[data-bi]').forEach(cb=>{const i=+cb.dataset.bi,b=BK[i];if(!cb.checked||b.kind==='credit')return;
  const name=(ibody.querySelector('[data-bn="'+i+'"]').value.trim()||b.merchant||'Item').slice(0,60);

  if(b.dateMissing)n.dateCheck=true;

  else if(b.merchant)S.mem[mkey(b.merchant)]=name;
  S.entries.push(n);flyIds.add(n.id);ids.push(n.id);added++});
 closeIsland();if(!added){toast('Nothing ticked');return}

  '<div class="hint" style="font-size:12px;opacity:.7;margin-bottom:4px">Dad paid</div><input id="sAmt" class="big" inputmode="decimal" enterkeyhint="done" value="'+fmtPlain(pre!=null?pre:T.total)+'" aria-label="Amount paid">'+
  '<div class="chips"><button class="chip" id="sPaste" type="button">Paste his payment SMS</button></div><textarea id="sTxt" rows="2" class="hid" placeholder="Paste his payment SMS here"></textarea>'+
  '<div class="ia"><span class="hint" id="sHint">Total due '+money(T.total)+'. Anything unpaid carries to the next bill.</span><button class="ib2 go" id="sGo">'+IC.enter+'Confirm</button></div>');
 ibody.querySelector('[data-close]').onclick=closeIsland;
 const a=$('#sAmt');a.focus({preventScroll:true});a.select();
 const useText=t=>{const m=splitMsgs(t)[0]||parseOne(t);if(m&&m.amount>0){a.value=fmtPlain(m.amount);$('#sHint').textContent='Read '+money(m.amount)+' from the SMS. Total due '+money(T.total)+'.';fit();return true}return false};
 $('#sPaste').onclick=async()=>{try{const t=await navigator.clipboard.readText();if(t&&useText(t))return}catch(e){}$('#sTxt').classList.remove('hid');$('#sTxt').focus();fit()};
 $('#sTxt').oninput=e=>useText(e.target.value);
 a.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();doSettle()}};$('#sGo').onclick=doSettle}
function doSettle(){
 const paid=num($('#sAmt').value);if(!(paid>=0)){shake();return}
 const T=calc();if(T.missing.length)return;
 const rec={id:uid(),from:billStart(),to:today(),entries:S.entries.map(e=>Object.assign({},e,{inr:inrOf(e)})),carryIn:S.carry,total:T.total,paid:r2(paid),manual:Object.assign({},S.manual),prevSettled:S.lastSettled,prevBilled:S.lastBilled};
 S.history.unshift(rec);S.carry=r2(T.total-paid);S.entries=[];S.manual={};S.lastSettled=today();S.lastBilled=null;
 const keep={};S.history.slice(0,1).forEach(h=>h.entries.forEach(e=>{const k=e.cur+'|'+e.date;if(S.fx[k])keep[k]=S.fx[k]}));S.fx=keep;
 closeIsland();save();
 toast(S.carry>0?'Settled. '+money(S.carry)+' carries to the next bill':S.carry<0?'Settled. Credit of '+money(-S.carry)+' carries forward':'Settled');
 backup(true)}
function undoSettle(){
 const r=S.history[0];if(!r)return;if(!confirm('Reopen the bill from '+dLong(r.from)+'?'))return;S.history.shift();
 S.entries=r.entries.map(e=>{const c=Object.assign({},e);delete c.inr;return c}).concat(S.entries);
 S.carry=r.carryIn;S.manual=Object.assign({},r.manual||{});S.lastSettled=r.prevSettled||null;S.lastBilled=r.prevBilled||null;
 closePanel();save();toast('Bill reopened');fetchRates()}
/* hold gesture */
(function(){const b=$('#bHold'),f=$('#hfill');let armed=false;
 const stop=()=>{armed=false;b.classList.remove('go')};
 b.addEventListener('pointerdown',ev=>{ev.preventDefault();if(!S.entries.length&&!S.carry){toast('Nothing to settle');return}armed=true;b.classList.add('go')});
 f.addEventListener('transitionend',()=>{if(armed&&b.classList.contains('go')){armed=false;if(navigator.vibrate)navigator.vibrate(30);setTimeout(()=>{b.classList.remove('go');openSettle()},80)}});
 ['pointerup','pointerleave','pointercancel'].forEach(k=>b.addEventListener(k,stop));
 b.addEventListener('contextmenu',e=>e.preventDefault());
 b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSettle()}})})();
/* rates */
const fxFail={};let fxBusy=false;
async function fetchRates(){
 if(fxBusy)return;const need=[...new Set(S.entries.filter(e=>e.cur!=='INR'&&!(S.manual[e.cur]>0)&&!(S.fx[e.cur+'|'+e.date]>0)).map(e=>e.cur+'|'+e.date))];
 if(!need.length)return;if(!navigator.onLine){need.forEach(k=>fxFail[k.split('|')[0]]=true);render();return}
 fxBusy=true;render();let changed=false;
 for(const k of need){const [c,d]=k.split('|');
  try{const r=await fetch('https://api.frankfurter.dev/v2/rate/'+c.toLowerCase()+'/inr?date='+d);if(!r.ok)throw new Error(r.status);
   const j=await r.json();const v=num(j&&(j.rate!=null?j.rate:(j.rates&&j.rates.INR!=null?j.rates.INR:(Array.isArray(j)&&j[0]?j[0].rate:NaN))));
   if(!(v>0))throw new Error('no rate');S.fx[k]=v;changed=true;delete fxFail[c]}catch(e){fxFail[c]=true}}
 fxBusy=false;if(changed)save(false);else render()}
window.addEventListener('online',fetchRates);
function openRate(c){
 const g=calc().fx[c];if(!g)return;
 const auto=S.entries.filter(e=>e.cur===c).map(e=>S.fx[c+'|'+e.date]).filter(Boolean);
 const autoTxt=auto.length?'Market rates by purchase date: '+[...new Set(auto)].join(', '):(fxFail[c]?'Market rate could not be fetched. Check your connection or type a rate.':'Market rate not fetched yet.');
 openIsland('rate','<div class="ih"><b>'+c+' rate</b><button class="ix" data-close aria-label="Close">'+IC.x+'</button></div>'+
  '<div class="note">'+esc(autoTxt)+'</div><div class="hint" style="font-size:12px;opacity:.7;margin-bottom:4px">Rate from your statement, used for every '+c+' item on this bill</div>'+
  '<input id="rAmt" class="big" inputmode="decimal" enterkeyhint="done" placeholder="₹ per 1 '+c+'" value="'+(S.manual[c]||'')+'" aria-label="Rate">'+
  '<div class="ia"><span class="hint">'+c+' '+fmt(g.sum)+' on this bill</span>'+(S.manual[c]?'<button class="ib2 gh" id="rClr">Use market rates</button>':'')+'<button class="ib2 gh" id="rTry">Fetch again</button><button class="ib2 go" id="rGo">'+IC.enter+'Save</button></div>');
 ibody.querySelector('[data-close]').onclick=closeIsland;
 const i=$('#rAmt');i.focus({preventScroll:true});
 const go=()=>{const v=num(i.value);if(!(v>0)){shake();return}S.manual[c]=v;closeIsland();save()};
 i.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();go()}};$('#rGo').onclick=go;
 $('#rTry').onclick=()=>{delete fxFail[c];closeIsland();fetchRates()};
 if($('#rClr'))$('#rClr').onclick=()=>{delete S.manual[c];closeIsland();save();fetchRates()}}

/* ---------- bill for Dad ---------- */
function billText(){
 const E=[...S.entries].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id),L=[];
 L.push('*Bill: '+dLong(billStart())+' to '+dLong(today())+'*','');
 E.filter(e=>e.amount>0).forEach(e=>{const rs=E.filter(x=>x.rid===e.id);const net=r2(inrOf(e)+rs.reduce((a,x)=>a+inrOf(x),0));if(net>0)L.push(e.name+': '+money(net))});
 E.filter(e=>e.amount<0&&!E.some(p=>p.id===e.rid)).forEach(e=>L.push('Refund, '+e.name+': '+money(inrOf(e))));
 if(S.carry>0)L.push('From last bill: '+money(S.carry));
 if(S.carry<0)L.push('Credit from last bill: '+money(S.carry));
 L.push('','*Total: '+money(calc().total)+'*');return L.join('\n')}
function canBill(){const T=calc();if(!S.entries.length&&!S.carry){toast('Nothing to bill yet');return false}if(T.missing.length){toast('Set the '+T.missing.join(', ')+' rate first');openRate(T.missing[0]);return false}return true}
$('#bSend').onclick=()=>{if(!canBill())return;let n=S.settings.wa.replace(/\D/g,'');if(n.length===10)n='91'+n;
 S.lastBilled=new Date().toISOString();persist();render();
 window.open('https://wa.me/'+n+'?text='+encodeURIComponent(billText()),'_blank');
 if(!n)setTimeout(()=>toast('Add Dad\'s number in Settings to skip picking the chat',()=>openSettings(),'Settings'),800)};
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();return ok}}

/* ---------- menu, panels ---------- */
function closeMenu(){$('#menu').classList.remove('on')}
$('#bMenu').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('on')};
document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('#bMenu'))closeMenu()});
$('#menu').onclick=async e=>{const b=e.target.closest('[data-m]');if(!b)return;closeMenu();const m=b.dataset.m;
 if(m==='history')openHistory();else if(m==='settings')openSettings();else if(m==='backup')backup(false);
 else if(m==='copy'){if(!canBill())return;toast(await copyText(billText())?'Bill text copied':'Could not copy on this phone')}};
document.addEventListener('click',e=>{const r=e.target.closest('[data-rate]');if(r){openRate(r.dataset.rate);return}const a=e.target.closest('[data-act=backup]');if(a)backup(false)});
const panel=$('#panel');
function openPanel(html){closeIsland();panel.innerHTML='<div class="grab"></div>'+html;panel.classList.add('on');scrim.classList.add('on')}
function closePanel(){if(!panel.classList.contains('on'))return;panel.classList.remove('on');if(!IS)scrim.classList.remove('on')}
function openHistory(){
 const h=S.history;
 openPanel('<h2>Settled bills</h2>'+(h.length?h.map((r,i)=>'<div class="hi"><b>'+money(r.total)+'</b> <span style="color:var(--mt)">paid '+money(r.paid)+'</span><div class="m">'+dLong(r.from)+' to '+dLong(r.to)+', '+r.entries.length+(r.entries.length===1?' entry':' entries')+(r.paid<r.total?', '+money(r2(r.total-r.paid))+' carried':r.paid>r.total?', '+money(r2(r.paid-r.total))+' credit':'')+'</div><div class="m">'+r.entries.slice(0,40).map(e=>esc(e.name)+' '+money(e.inr!=null?e.inr:e.amount,e.inr!=null?'INR':e.cur)).join(', ')+'</div>'+(i===0?'<div class="prow"><button class="pb" id="hUndo">Reopen this bill</button></div>':'')+'</div>').join(''):'<p style="color:var(--mt)">No settled bills yet. They show up here after you hold to settle.</p>'));
 if($('#hUndo'))$('#hUndo').onclick=undoSettle}
function openSettings(){
 openPanel('<h2>Settings</h2>'+
  '<div class="fl">Dad\'s WhatsApp number</div><input class="in" id="stWa" inputmode="tel" placeholder="98765 43210" value="'+esc(S.settings.wa)+'">'+
  '<div class="fl">Remind me when entries sit unbilled for this many days</div><input class="in" id="stNd" inputmode="numeric" value="'+S.settings.nudgeDays+'">'+
  '<div class="fl">Backups. Last one: '+(S.lastBackup?dLong(iso(new Date(S.lastBackup))):'none yet')+'</div>'+
  '<div class="prow"><button class="pb pri" id="stBk">Back up now</button><button class="pb" id="stRs">Restore a backup</button></div>'+
  '<div class="fl">Learnt item names: '+Object.keys(S.mem).length+'</div><div class="prow"><button class="pb" id="stMem">Forget learnt names</button></div>'+
  '<div class="ver">Ledger version '+VERSION+'</div>');
 $('#stWa').oninput=e=>{S.settings.wa=e.target.value.trim();persist()};
 $('#stNd').oninput=e=>{const v=parseInt(e.target.value,10);if(v>0){S.settings.nudgeDays=v;persist();render()}};
 $('#stBk').onclick=()=>backup(false);$('#stRs').onclick=()=>$('#fRestore').click();
 $('#stMem').onclick=()=>{if(confirm('Forget all learnt item names?')){S.mem={};persist();openSettings();toast('Forgotten')}}}

/* ---------- backup and restore ---------- */
async function backup(silent){
 const snap=Object.assign({},S,{changes:0,lastBackup:new Date().toISOString(),app:'ledger',version:VERSION});
 const name='ledger-backup-'+today()+'.json',txt=JSON.stringify(snap);
 const done=()=>{S.changes=0;S.lastBackup=snap.lastBackup;persist();render();if(panel.classList.contains('on')&&$('#stBk'))openSettings()};
 if(!silent){try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});done();toast('Backup saved');return}}catch(e){if(e&&e.name==='AbortError')return}}
 try{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);done();toast(silent?'Settled. Backup downloaded':'Backup downloaded')}catch(e){toast('Backup failed on this phone')}}
$('#fRestore').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
 r.onload=()=>{let p;try{p=JSON.parse(r.result)}catch(_){toast('That file is not a Ledger backup');return}
  if(!p||!Array.isArray(p.entries)){toast('That file is not a Ledger backup');return}
  const s=norm(p);if(!confirm('Replace what is here ('+S.entries.length+' entries) with this backup ('+s.entries.length+' entries)?'))return;
  s.changes=0;S=s;persist();closePanel();render();toast('Backup restored');fetchRates()};r.readAsText(f)};

/* ---------- keyboard awareness ---------- */
(function(){const vv=window.visualViewport;if(!vv)return;const f=()=>{const k=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);document.documentElement.style.setProperty('--kb',k+'px');fit()};vv.addEventListener('resize',f);vv.addEventListener('scroll',f)})();

/* ---------- start ---------- */
if(corruptRaw){$('#banner').innerHTML='<div class="banner">Saved data on this phone could not be read, so the app started empty. Your old data is kept.<button id="bnDl">Download the old data</button></div>';
 $('#bnDl').onclick=()=>{const u=URL.createObjectURL(new Blob([corruptRaw],{type:'text/plain'})),a=document.createElement('a');a.href=u;a.download='ledger-unreadable-'+today()+'.txt';a.click()}}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
render();fetchRates();
(function(){const q=new URLSearchParams(location.search);const t=q.get('text')||q.get('sms');if(t){history.replaceState(null,'',location.pathname);const msgs=splitMsgs(t);if(msgs.length){openEntry({},false);handleMsgs(msgs,t,true)}}})();
</script>
